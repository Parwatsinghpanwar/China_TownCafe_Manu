<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Town Cafe - Menu</title>
<style>
  :root{
    --wine:#4a1116;
    --wine-deep:#33090c;
    --gold:#f0c419;
    --gold-deep:#d9a90a;
    --cream:#fbf3e2;
    --paper:#fffaf0;
    --ink:#2b1010;
    --muted:#8a5b56;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--wine-deep);
    color:var(--ink);
  }
  header{
    background:linear-gradient(180deg,var(--wine) 0%, var(--wine-deep) 100%);
    padding:22px 16px 16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .header-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    max-width:480px;
    margin:0 auto;
  }
  .header-text{
    text-align:center;
    flex:1;
  }
  .logo{
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid var(--gold);
    flex-shrink:0;
    object-fit:cover;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .brand-tag{
    display:inline-block;
    background:var(--gold);
    color:var(--wine-deep);
    font-weight:800;
    font-size:11px;
    letter-spacing:.14em;
    padding:4px 12px;
    border-radius:2px;
    transform:skewX(-8deg);
    margin-bottom:8px;
  }
  h1{
    color:var(--cream);
    font-size:26px;
    margin:2px 0 4px;
    letter-spacing:.03em;
    font-family:Georgia,'Times New Roman',serif;
  }
  .sub{
    color:#e8c9a5;
    font-size:12px;
    letter-spacing:.05em;
    margin-bottom:14px;
  }
  .insta-link{
    color:#e8c9a5;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:12px;
    letter-spacing:.05em;
  }
  .search{
    max-width:480px;
    margin:0 auto 14px;
  }
  .search input{
    width:100%;
    padding:11px 14px;
    border-radius:22px;
    border:1px solid var(--gold-deep);
    background:var(--wine-deep);
    color:var(--cream);
    font-size:14px;
    outline:none;
  }
  .search input::placeholder{color:#c99;}
  nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 10px 12px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--gold-deep);
    color:var(--gold);
    padding:7px 14px;
    border-radius:16px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.03em;
    white-space:nowrap;
    cursor:pointer;
  }
  nav button.active{
    background:var(--gold);
    color:var(--wine-deep);
    border-color:var(--gold);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px 12px 60px;
  }
  .category{
    margin-bottom:26px;
    scroll-margin-top:190px;
  }
  .cat-title{
    display:inline-block;
    background:var(--gold);
    color:var(--wine-deep);
    font-weight:800;
    font-size:15px;
    letter-spacing:.05em;
    padding:6px 16px;
    border-radius:2px;
    transform:skewX(-8deg);
    margin-bottom:10px;
  }
  .cat-title span{display:inline-block;transform:skewX(8deg);}
  .card{
    background:var(--paper);
    border:1px solid #e9d8b8;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid #f0e4c9;
  }
  .item:last-child{border-bottom:none;}
  .item .name{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .item .price{
    font-size:14.5px;
    font-weight:700;
    color:var(--wine);
    white-space:nowrap;
  }
  .item.hidden{display:none;}
  .category.hidden{display:none;}
  footer{
    text-align:center;
    color:#e8c9a5;
    font-size:11.5px;
    padding:18px 10px 26px;
    letter-spacing:.05em;
  }
  .empty-msg{
    display:none;
    text-align:center;
    color:var(--cream);
    padding:40px 10px;
    font-size:14px;
  }
</style>
</head>

function scrollToCat(idx){
  const el = document.getElementById('cat-' + idx);
  const headerH = document.querySelector('header').offsetHeight;
  const top = el.getBoundingClientRect().top + window.pageYOffset - headerH - 10;
  window.scrollTo({ top, behavior: 'smooth' });
  setActiveNav(idx);
}

function setActiveNav(idx){
  [...nav.children].forEach(b => b.classList.toggle('active', +b.dataset.idx === idx));
}

// highlight nav on scroll
const sections = [...document.querySelectorAll('.category')];
window.addEventListener('scroll', () => {
  const headerH = document.querySelector('header').offsetHeight;
  let current = 0;
  sections.forEach((s, i) => {
    if (s.getBoundingClientRect().top - headerH - 20 <= 0) current = i;
  });
  setActiveNav(current);
});
setActiveNav(0);

function filterItems(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let anyVisible = false;
  sections.forEach(section => {
    let sectionHasMatch = false;
    section.querySelectorAll('.item').forEach(item => {
      const match = item.dataset.name.includes(q);
      item.classList.toggle('hidden', !match);
      if (match) sectionHasMatch = true;
    });
    section.classList.toggle('hidden', !sectionHasMatch);
    if (sectionHasMatch) anyVisible = true;
  });
  document.getElementById('emptyMsg').style.display = anyVisible || q === '' ? 'none' : 'block';
  document.getElementById('mainContent').style.display = anyVisible || q === '' ? '' : 'none';
}
</script>

</body>
